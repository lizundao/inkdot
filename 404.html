<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f2e9">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>页面走丢了 · 墨点</title>
  <link rel="stylesheet" href="assets/fonts/lxgw/font.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function(){try{var t=localStorage.getItem('inkdot-theme');var d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));}catch(e){}})();
  </script>
  <style>body{min-height:100vh}.err-wrap{text-align:center;padding:14vh 20px}.err-code{font-family:var(--font-brand);font-size:120px;line-height:1;color:var(--seal);margin:0;font-weight:700}.err-wrap img{width:76px;height:76px;object-fit:contain;margin:0 auto 20px}.btn{margin-top:26px}</style>
</head>
<body>
  <main class="container err-wrap" style="margin-inline:auto">
    <img src="/assets/img/inkdot.png" alt="墨点">
    <p class="err-code">404</p>
    <h1 class="section-title" style="margin-top:8px">这一滴墨，还没落下</h1>
    <p class="section-sub" style="margin:12px auto 0">你要找的页面不存在，或已经被挪走了。</p>
    <a href="/" class="btn btn-primary">回到首页 →</a>
  </main>
</body>
</html>
